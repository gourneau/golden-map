  <!-- Nothing on this page exists until the module graph lands, so this mark
       is the whole first paint on a slow connection: the record's rim, and a
       pulsar beating inside it. No words — the site's own vocabulary instead.

  <div id="gm-boot" role="status" aria-label="Loading the Golden Record"></div>
  <div id="ui"></div>
  <noscript><p class="noscript">This experience needs JavaScript — it is, after all, a machine for decoding a machine.</p></noscript>
  <script>
  (function () {
    var done = false;
    function surrender() {
      if (done || window.__ctx) return;
      done = true;
      var boot = document.getElementById('gm-boot');
      if (boot) boot.remove();
      var ui = document.getElementById('ui');
      if (!ui || ui.firstChild) return;
      document.body.className += ' gm-nogl';
      ui.innerHTML = '<section class="gm-fallback">' +
        '<h1>The Golden Record</h1>' +
        '<p class="gm-tagline">Earth\u2019s address, written in dying stars</p>' +
        '<p class="gm-hook">This page didn\u2019t finish loading \u2014 something ' +

        '<a href="https://www.johnstonsarchive.net/astro/pulsarmap.html">Johnston (2007) \u2014 reading the map back</a> \u00b7 ' +
        '<a href="https://github.com/gourneau/golden-map">code &amp; sources on GitHub</a></p></section>';
    }
    // long enough for a slow 3G first load (~400KB gzip), short enough that
    // nobody stares at a spinning ring wondering if it is broken
    setTimeout(surrender, 15000);
    document.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') surrender();
    }, true);
  })();
